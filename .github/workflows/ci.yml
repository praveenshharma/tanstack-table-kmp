name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-android:
    name: JVM + Android build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile commonMain + Android targets
        run: |
          ./gradlew --no-daemon \
            :table-core:compileDebugKotlinAndroid \
            :table-compose:compileDebugKotlinAndroid \
            :sample:compileDebugKotlinAndroid \
            :table-core:assemble \
            :table-compose:assemble
      - name: Run :table-core unit tests (JVM)
        run: ./gradlew --no-daemon :table-core:jvmTest
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-jvm
          path: |
            **/build/reports/tests/
            **/build/test-results/

  ios:
    name: iOS framework build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile commonMain + iOS targets
        run: |
          ./gradlew --no-daemon \
            :table-core:compileKotlinIosSimulatorArm64 \
            :table-core:compileTestKotlinIosSimulatorArm64 \
            :table-compose:compileKotlinIosSimulatorArm64 \
            :sample:compileKotlinIosSimulatorArm64 \
            :sample:linkDebugFrameworkIosSimulatorArm64
      - name: Run :table-core tests (iOS simulator)
        run: ./gradlew --no-daemon :table-core:iosSimulatorArm64Test
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ios
          path: |
            **/build/reports/tests/
            **/build/test-results/
